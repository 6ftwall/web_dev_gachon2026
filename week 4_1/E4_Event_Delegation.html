<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real-Time Search Filter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .search-app {
      background-color: #ffffff;
      width: 380px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #111827;
    }

    #search {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 16px;
    }

    #search:focus {
      border-color: #2563eb;
    }

    .student-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .student {
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 15px;
      color: #374151;
    }

    .student:last-child {
      border-bottom: none;
    }

    mark {
      background-color: #fef08a;
      color: #854d0e;
      border-radius: 2px;
      padding: 0 2px;
    }

    #no-results {
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
      margin: 16px 0 0;
      display: none;
    }
  </style>
</head>
<body>

  <div class="search-app">
    <h2>Student Directory</h2>
    
    <input type="text" id="search" placeholder="Search students by name...">

    <ul class="student-list">
      <li class="student" data-name="Alice Smith">Alice Smith — Computer Science</li>
      <li class="student" data-name="Bob Jones">Bob Jones — Software Engineering</li>
      <li class="student" data-name="Charlie Brown">Charlie Brown — Data Science</li>
      <li class="student" data-name="Diana Prince">Diana Prince — Cybersecurity</li>
      <li class="student" data-name="Ethan Hunt">Ethan Hunt — Artificial Intelligence</li>
    </ul>

    <p id="no-results">No matching students found.</p>
  </div>

  <script>
    const searchInp = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    searchInp.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      let visible = 0;
      students.forEach(s => {
        const name = s.dataset.name.toLowerCase();
        if (name.includes(term)) {
          s.style.display = '';
          visible++;
          // Bonus: highlight match
          if (term) {
            const rx = new RegExp(`(${term})`, 'gi');
            s.innerHTML = s.dataset.name.replace(rx, '<mark>$1</mark>')
              + ' — ' + s.textContent.split('—')[1].trim();
          } else {
            s.textContent = s.dataset.name + ' — '
              + s.textContent.split('—')[1].trim();
          }
        } else {
          s.style.display = 'none';
        }
      });
      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
  </script>

</body>
</html>
