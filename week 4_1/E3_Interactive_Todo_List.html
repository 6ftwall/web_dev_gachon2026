<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .todo-app {
      background-color: #ffffff;
      width: 360px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #111827;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    #add-btn {
      padding: 10px 16px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #add-btn:hover {
      background-color: #1d4ed8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 15px;
      color: #374151;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .del-btn:hover {
      background-color: #fee2e2;
    }

    #empty-msg {
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
      margin: 16px 0 0;
    }
  </style>
</head>
<body>

  <div class="todo-app">
    <h2>To-Do List</h2>
    
    <div class="input-group">
      <input type="text" id="todo-input" placeholder="Add a new task...">
      <button id="add-btn">Add</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-msg">No tasks yet!</p>
  </div>

  <script>
    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const list = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');

    function updateEmpty() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `<span>${text}</span><button class="del-btn">✕</button>`;
      list.appendChild(li);
      input.value = '';
      updateEmpty();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });
    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('del-btn')) {
        e.target.closest('li').remove();
        updateEmpty();
      }
    });

    updateEmpty();
  </script>

</body>
</html>
