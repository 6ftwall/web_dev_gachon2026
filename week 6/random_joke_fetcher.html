<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fetch a random joke.">
  <title>Random Joke Fetcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #62666d;
      --paper: #f5f6f7;
      --white: #ffffff;
      --line: #dfe2e6;
      --blue: #2864dc;
      --sans: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 max(24px, calc((100% - 920px) / 2));
      border-bottom: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .top-note {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
    }
    main {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: clamp(42px, 9vh, 92px) 0 64px;
    }
    .eyebrow, .section-label {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 10px;
      font-size: clamp(36px, 7vw, 54px);
      font-weight: 700;
      line-height: 1.1;
    }
    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    .joke-panel {
      margin-top: 34px;
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }
    .joke-copy {
      min-height: 150px;
      display: grid;
      align-content: center;
      gap: 22px;
    }
    .joke-copy p { margin: 0; }
    .joke-copy .section-label { margin-bottom: 7px; }
    .joke-text {
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 500;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .punchline {
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 27px;
    }
    button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 19px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: white;
      font: 600 14px var(--sans);
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1f50b5; }
    button:focus-visible { outline: 3px solid #91b4ff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .75; }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgb(255 255 255 / 45%);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    [hidden] { display: none !important; }
    .status {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .status.error { color: #a33e31; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 20px; }
      .top-note { font-size: 9px; }
      .actions { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="../index.html">Web Studies</a>
    <span class="top-note">Week 6 assignment</span>
  </header>
  <main>
    <p class="eyebrow">A little break</p>
    <h1>Random Joke Fetcher</h1>
    <p class="intro">Need a quick laugh? Get a random joke, one click at a time.</p>

    <section class="joke-panel" aria-label="Random joke">
      <div class="joke-copy" aria-live="polite" aria-busy="false">
        <div>
          <p class="section-label">Setup</p>
          <p class="joke-text" id="setup">Your next joke is one click away.</p>
        </div>
        <div class="punchline">
          <p class="section-label">Punchline</p>
          <p class="joke-text" id="punchline">Ready when you are.</p>
        </div>
      </div>
      <div class="actions">
        <button id="load-button" type="button">
          <span id="button-label">Get a joke</span>
          <span class="spinner" id="spinner" aria-hidden="true" hidden></span>
        </button>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </main>
  <script>
    const loadButton = document.querySelector("#load-button");
    const buttonLabel = document.querySelector("#button-label");
    const spinner = document.querySelector("#spinner");
    const jokeCopy = document.querySelector(".joke-copy");
    const setup = document.querySelector("#setup");
    const punchline = document.querySelector("#punchline");
    const status = document.querySelector("#status");

    async function loadJoke() {
      loadButton.disabled = true;
      buttonLabel.textContent = "Loading...";
      spinner.hidden = false;
      jokeCopy.setAttribute("aria-busy", "true");
      status.textContent = "";
      status.classList.remove("error");
      setup.textContent = "Loading a joke...";
      punchline.textContent = "";

      try {
        const response = await fetch("https://official-joke-api.appspot.com/random_joke");
        if (!response.ok) throw new Error("Request failed");
        const joke = await response.json();
        setup.textContent = joke.setup;
        punchline.textContent = joke.punchline;
      } catch {
        setup.textContent = "We couldn't get a joke right now.";
        punchline.textContent = "Please try again in a moment.";
        status.textContent = "Check your connection and try again.";
        status.classList.add("error");
      } finally {
        loadButton.disabled = false;
        buttonLabel.textContent = "Get another joke";
        spinner.hidden = true;
        jokeCopy.setAttribute("aria-busy", "false");
      }
    }

    loadButton.addEventListener("click", loadJoke);
  </script>
</body>
</html>
