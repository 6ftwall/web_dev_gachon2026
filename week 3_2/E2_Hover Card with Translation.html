<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  body { padding: 40px; background: #faf5ff; }
  .card {
    background: white;
    border: 2px solid #a855f7;
    border-radius: 16px;
    padding: 24px;
    width: 240px;
    color: #6b21a8;
    font-size: 16px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 16px 32px rgba(168, 85, 247, 0.2);
  }
</style>
</head>
<body>
  <div class="card">Hover over me!</div>
</body>
</html>
